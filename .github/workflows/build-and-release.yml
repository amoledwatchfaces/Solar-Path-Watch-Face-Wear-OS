name: Build & Release

on:
  push:
    branches: [ "master", "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 || secrets.RELEASE_KEYSTORE }}
        run: |
          if [ -n "$SIGNING_KEY_BASE64" ]; then
            echo "$SIGNING_KEY_BASE64" | base64 -d > wear/release.jks
            echo "Keystore decoded to wear/release.jks"
          else
            echo "Signing key secret not set, skipping decoding."
          fi

      - name: Build Release APK
        env:
          KEYSTORE_FILE_PATH: "release.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :wear:assembleRelease

      - name: Clean Up Keystore
        if: always()
        run: |
          rm -f wear/release.jks

      - name: Locate Artifacts
        run: |
          echo "Finding APKs..."
          find wear/build/outputs/apk/release -name "*.apk" || echo "No APKs found"

      - name: Upload Build Artifacts (CI)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: solar-path-wear-release
          path: wear/build/outputs/apk/release/*.apk

      - name: Create GitHub Release and Upload Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: wear/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
