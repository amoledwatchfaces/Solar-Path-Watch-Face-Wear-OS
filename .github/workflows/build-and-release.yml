name: Build & Release

on:
  push:
    branches: [ "master", "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Decode Release Keystore
        run: |
          SIGNING_KEY="${{ secrets.RELEASE_KEYSTORE || secrets.SIGNING_KEY_BASE64 }}"
          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 --decode > "${{ github.workspace }}/release.jks"
            echo "KEYSTORE_FILE=${{ github.workspace }}/release.jks" >> $GITHUB_ENV
            echo "Keystore decoded successfully."
          else
            echo "Signing key secret not set, skipping decoding."
          fi

      - name: Build Release APK & AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || secrets.KEY_PASSWORD }}
        run: ./gradlew :wear:assembleRelease :wear:bundleRelease

      - name: Clean Up Keystore
        if: always()
        run: |
          rm -f "${{ github.workspace }}/release.jks"

      - name: Stage Release Artifacts
        run: |
          mkdir -p staging
          if [ -f wear/build/outputs/apk/release/wear-release.apk ]; then
            cp wear/build/outputs/apk/release/wear-release.apk staging/solar-path-watch-face-wear.apk
          fi
          if [ -f wear/build/outputs/bundle/release/wear-release.aab ]; then
            cp wear/build/outputs/bundle/release/wear-release.aab staging/solar-path-watch-face-wear.aab
          fi
          echo "Staged files:"
          ls -la staging/

      - name: Upload Build Artifacts (CI)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: solar-path-release-binaries
          path: staging/*

      - name: Create GitHub Release and Upload Assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            staging/solar-path-watch-face-wear.apk
            staging/solar-path-watch-face-wear.aab
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
